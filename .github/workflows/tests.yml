name: Pruebas

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: password
          MYSQL_DATABASE: testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: root
      DB_PASSWORD: password

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, gd, zip, intl, bcmath
          coverage: none

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Copiar archivo de entorno
        run: cp .env.example .env

      - name: Instalar dependencias de PHP
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Generar clave de la aplicacion
        run: php artisan key:generate

      - name: Instalar dependencias de JavaScript
        run: pnpm install --frozen-lockfile

      - name: Compilar assets
        run: pnpm run build

      # A proposito sin --seed: las pruebas de Pest no dependen de los datos de
      # demo (usan factories propias), y correr migrate:fresh --seed aca solo
      # sumaria ~100 equipos falsos sin aportar nada a la cobertura.
      - name: Correr migraciones
        run: php artisan migrate --force

      - name: Correr pruebas (Pest)
        run: ./vendor/bin/pest
